name: Build daily news
on:
  schedule:
    - cron: "30 0 * * *"   # 00:30 UTC = 06:30 in Bangladesh. Change the time here.
  workflow_dispatch:        # lets you press "Run workflow" manually
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python fetch_news.py
      - run: |
          git config user.name "news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/index.html translations.json
          git commit -m "Update news" || echo "no changes"
          git push
